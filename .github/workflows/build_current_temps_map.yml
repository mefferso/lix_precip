name: Build current station obs maps

on:
  push:
    paths:
      - 'scripts/fetch_lix_obs.py'
      - 'scripts/build_lix_obs_maps.py'
      - 'scripts/build_4panel.py'
      - 'data/manual_station_excludes.json'
      - '.github/workflows/build_current_temps_map.yml'
      - 'docs/obs_qc.html'
  workflow_dispatch:
    inputs:
      end_time_utc:
        description: 'Optional end time in YYYYMMDDHHMM format'
        required: false
        default: ''
  schedule:
    - cron: '15 * * * *'

permissions:
  contents: write

concurrency:
  group: lix-station-products
  cancel-in-progress: true

jobs:
  build-station-products:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (eccodes)
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install 'herbie-data[extras]' s3fs

      - name: Build station CSV/JSON products
        env:
          SYNOPTIC_TOKEN: ${{ secrets.SYNOPTIC_TOKEN }}
          END_TIME_UTC: ${{ github.event.inputs.end_time_utc }}
        run: |
          if [ -n "$END_TIME_UTC" ]; then
            python scripts/fetch_lix_obs.py "$END_TIME_UTC"
          else
            python scripts/fetch_lix_obs.py
          fi

      - name: Build station PNG maps
        run: |
          python scripts/build_lix_obs_maps.py

      - name: Stitch 4-panel image
        run: |
          python scripts/build_4panel.py

      - name: Commit updated station products
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/lix_station_products/docs

          find docs -maxdepth 1 -type f \( \
            -name 'station_*_latest.csv' -o \
            -name 'station_*_latest.json' -o \
            -name 'lix_station_*_latest.png' -o \
            -name 'latest_station_maps.json' -o \
            -name 'lix_4panel_latest.png' \
          \) -exec cp -p {} /tmp/lix_station_products/docs/ \;

          if [ -z "$(find /tmp/lix_station_products/docs -type f -print -quit)" ]; then
            echo "No station product files were generated."
            exit 0
          fi

          git fetch origin main
          git reset --hard origin/main

          cp -p /tmp/lix_station_products/docs/* docs/

          git add \
            docs/station_*_latest.csv \
            docs/station_*_latest.json \
            docs/lix_station_*_latest.png \
            docs/latest_station_maps.json \
            docs/lix_4panel_latest.png

          if git diff --cached --quiet; then
            echo "No station product changes to commit."
            exit 0
          fi

          git commit -m "Update LIX station products"
          git push origin main
