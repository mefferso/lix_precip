name: Fix Coastal LA station archive

on:
  push:
    paths:
      - '.github/workflows/fix_station_coastal_la_archive.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install 'herbie-data[extras]' s3fs

      - name: Patch Coastal LA station/archive configs
        shell: python
        run: |
          from pathlib import Path

          coastal_one_line = '    "coastal_la": {"label": "Coastal LA", "bbox": (-91.05, 29.05, -89.70, 30.00), "suffix": "_coastal_la"},\n'
          coastal_block = '''    "coastal_la": {
              "label": "Coastal LA",
              "bbox": (-91.05, 29.05, -89.70, 30.00),
              "suffix": "_coastal_la",
          },
          '''.replace('          ', '')

          # Current/latest map builder uses compact one-line REGIONS entries.
          p = Path('scripts/build_lix_obs_maps.py')
          text = p.read_text()
          if '"coastal_la"' not in text:
              text = text.replace(
                  '    "southwest_ms": {"label": "Southwest MS", "bbox": (-91.25, 30.80, -89.75, 31.85), "suffix": "_southwest_ms"},\n',
                  '    "southwest_ms": {"label": "Southwest MS", "bbox": (-91.25, 30.80, -89.75, 31.85), "suffix": "_southwest_ms"},\n' + coastal_one_line,
              )
          p.write_text(text)

          # Archive map builder uses expanded multiline REGIONS entries.
          p = Path('scripts/build_lix_obs_archive_maps.py')
          text = p.read_text()
          if '"coastal_la"' not in text:
              text = text.replace(
                  '    "coastal_ms": {\n        "label": "Coastal MS",\n        "bbox": (-89.75, 30.05, -88.25, 30.70),\n        "suffix": "_coastal_ms",\n    },\n',
                  coastal_block + '    "coastal_ms": {\n        "label": "Coastal MS",\n        "bbox": (-89.75, 30.05, -88.25, 30.70),\n        "suffix": "_coastal_ms",\n    },\n',
              )
          p.write_text(text)

          # Archive copy/manifest builder had its own hardcoded expected PNG lists.
          p = Path('scripts/build_station_daily_archive.py')
          text = p.read_text()
          replacements = {
              '        "lix_station_precip_24h_southwest_ms_latest.png",\n        "lix_station_precip_24h_coastal_ms_latest.png",':
              '        "lix_station_precip_24h_southwest_ms_latest.png",\n        "lix_station_precip_24h_coastal_la_latest.png",\n        "lix_station_precip_24h_coastal_ms_latest.png",',
              '        "lix_station_air_temp_daily_min_southwest_ms_latest.png",\n        "lix_station_air_temp_daily_min_coastal_ms_latest.png",':
              '        "lix_station_air_temp_daily_min_southwest_ms_latest.png",\n        "lix_station_air_temp_daily_min_coastal_la_latest.png",\n        "lix_station_air_temp_daily_min_coastal_ms_latest.png",',
              '        "lix_station_air_temp_daily_max_southwest_ms_latest.png",\n        "lix_station_air_temp_daily_max_coastal_ms_latest.png",':
              '        "lix_station_air_temp_daily_max_southwest_ms_latest.png",\n        "lix_station_air_temp_daily_max_coastal_la_latest.png",\n        "lix_station_air_temp_daily_max_coastal_ms_latest.png",',
              '    "_southwest_ms_": "southwest_ms",\n    "_coastal_ms_": "coastal_ms",':
              '    "_southwest_ms_": "southwest_ms",\n    "_coastal_la_": "coastal_la",\n    "_coastal_ms_": "coastal_ms",',
              '            "southwest_ms",\n            "coastal_ms",':
              '            "southwest_ms",\n            "coastal_la",\n            "coastal_ms",',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          p.write_text(text)

          # Page dropdown, in case Pages has an older generated copy.
          p = Path('docs/station_maps.html')
          text = p.read_text()
          text = text.replace(
              'southwest_ms:{label:"Southwest MS"},coastal_ms:{label:"Coastal MS"}',
              'southwest_ms:{label:"Southwest MS"},coastal_la:{label:"Coastal LA"},coastal_ms:{label:"Coastal MS"}',
          )
          text = text.replace(
              '["full","baton_rouge_metro","new_orleans_metro","southwest_ms","coastal_ms","northshore"]',
              '["full","baton_rouge_metro","new_orleans_metro","southwest_ms","coastal_la","coastal_ms","northshore"]',
          )
          p.write_text(text)

      - name: Rebuild today's station archive with Coastal LA
        env:
          SYNOPTIC_TOKEN: ${{ secrets.SYNOPTIC_TOKEN }}
        run: |
          python scripts/build_station_daily_archive.py --start-date 2026-06-19 --end-date 2026-06-19 --no-skip-existing

      - name: Commit fixed configs and rebuilt archive
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix_station_coastal_la_archive.yml
          git add scripts/build_lix_obs_maps.py scripts/build_lix_obs_archive_maps.py scripts/build_station_daily_archive.py docs/station_maps.html docs/archive/station/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix Coastal LA station archive maps"
          git pull --rebase origin main
          git push origin main
