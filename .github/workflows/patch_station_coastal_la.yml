name: Patch Coastal LA station maps

on:
  push:
    paths:
      - '.github/workflows/patch_station_coastal_la.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch station map region config
        shell: python
        run: |
          from pathlib import Path

          coastal_line = '    "coastal_la": {"label": "Coastal LA", "bbox": (-91.05, 29.05, -89.70, 30.00), "suffix": "_coastal_la"},\n'

          for file_name in ["scripts/build_lix_obs_maps.py", "scripts/build_lix_obs_archive_maps.py"]:
              path = Path(file_name)
              text = path.read_text()
              if '"coastal_la"' not in text:
                  text = text.replace(
                      '    "southwest_ms": {"label": "Southwest MS", "bbox": (-91.25, 30.80, -89.75, 31.85), "suffix": "_southwest_ms"},\n',
                      '    "southwest_ms": {"label": "Southwest MS", "bbox": (-91.25, 30.80, -89.75, 31.85), "suffix": "_southwest_ms"},\n' + coastal_line,
                  )
              path.write_text(text)

          html_path = Path("docs/station_maps.html")
          html = html_path.read_text()
          if "coastal_la:{label:\"Coastal LA\"}" not in html:
              html = html.replace(
                  'southwest_ms:{label:"Southwest MS"},coastal_ms:{label:"Coastal MS"}',
                  'southwest_ms:{label:"Southwest MS"},coastal_la:{label:"Coastal LA"},coastal_ms:{label:"Coastal MS"}',
              )
              html = html.replace(
                  '["full","baton_rouge_metro","new_orleans_metro","southwest_ms","coastal_ms","northshore"]',
                  '["full","baton_rouge_metro","new_orleans_metro","southwest_ms","coastal_la","coastal_ms","northshore"]',
              )
          html_path.write_text(html)

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch_station_coastal_la.yml
          git add scripts/build_lix_obs_maps.py scripts/build_lix_obs_archive_maps.py docs/station_maps.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add Coastal LA station map region"
          git push
