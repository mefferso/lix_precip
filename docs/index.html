<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WFO LIX Precipitation and Station Maps</title>
  <!-- Zoomed precip maps are generated as separate PNGs; this comment intentionally bumps Pages deployment. -->

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      background: #ececec;
      color: #111;
    }

    main {
      max-width: 1500px;
      margin: 0 auto;
      padding: 18px;
    }

    .card {
      background: #fff;
      border: 2px solid #111;
      border-radius: 10px;
      padding: 12px;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: end;
      gap: 14px;
      margin-bottom: 10px;
    }

    .title-wrap h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    .title-wrap p {
      margin: 0;
      font-size: 15px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: flex-end;
    }

    .controls label {
      font-weight: bold;
      display: block;
      margin-bottom: 4px;
    }

    select {
      padding: 8px;
      font-size: 16px;
      border-radius: 5px;
      border: 1px solid #ccc;
      min-width: 260px;
    }

    .button-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    
    .button-link {
      display: inline-block;
      padding: 10px 14px;
      border: 2px solid #111;
      border-radius: 8px;
      background: #f5f5f5;
      color: #111;
      text-decoration: none;
      font-weight: bold;
      white-space: nowrap;
    }

    .button-link:hover {
      background: #e9e9e9;
    }

    img {
      width: 100%;
      height: auto;
      display: block;
      margin-top: 15px;
      border: 1px solid #ccc;
      background: #f7f7f7;
    }

    .links {
      margin-top: 14px;
      font-size: 15px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .links-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    a {
      color: #0b57d0;
    }

    @media (max-width: 900px) {
      .topbar {
        flex-direction: column;
        align-items: stretch;
      }

      .controls {
        flex-direction: column;
        align-items: stretch;
      }

      .links {
        flex-direction: column;
        align-items: flex-start;
      }

      .links-group {
        width: 100%;
      }

      select {
        width: 100%;
        min-width: 0;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="card">
      <div class="topbar">
        <div class="title-wrap">
          <h1>WFO LIX Precipitation Maps</h1>
        </div>

        <div class="controls">
          <div>
            <label for="periodSelector">Rainfall Period:</label>
            <select id="periodSelector">
              <option value="24h">24-hr Rainfall</option>
              <option value="2d">2-Day Rainfall</option>
              <option value="3d">3-Day Rainfall</option>
              <option value="4d">4-Day Rainfall</option>
              <option value="5d">5-Day Rainfall</option>
              <option value="6d">6-Day Rainfall</option>
              <option value="7d">7-Day Rainfall</option>
              <option value="10d">10-Day Rainfall</option>
              <option value="14d">14-Day Rainfall</option>
              <option value="30d">30-Day Rainfall</option>
              <option value="mtd">Month-to-Date Rainfall</option>
              <option value="ytd">Year-to-Date Rainfall</option>
            </select>
          </div>

          <div>
            <label for="areaSelector">Map Area:</label>
            <select id="areaSelector">
              <option value="full">Full LIX Area</option>
              <option value="baton_rouge_metro">Baton Rouge Metro</option>
              <option value="new_orleans_metro">New Orleans Metro</option>
              <option value="southwest_ms">Southwest MS</option>
              <option value="coastal_ms">Coastal MS</option>
              <option value="northshore">Northshore of Lake Pontchartrain</option>
            </select>
          </div>
        </div>

        <div class="button-group">
          <a id="downloadPngLink" class="button-link" href="#" download>Download PNG</a>
          <a class="button-link" href="station_maps.html">View Station Observation Maps</a>
        </div>
      </div>

      <img
        id="precipMap"
        alt="WFO LIX precipitation map"
      >

      <div class="links">
        <div class="links-group">
          <a href="lix_station_precip_24h_latest.png">24h Station Rainfall PNG</a>
          <span>|</span>
          <a href="lix_station_air_temp_latest.png">Current Temp PNG</a>
          <span>|</span>
          <a href="lix_station_air_temp_daily_min_latest.png">Daily Low PNG</a>
          <span>|</span>
          <a href="lix_station_air_temp_daily_max_latest.png">Daily High PNG</a>
          <span>|</span>
          <a href="obs_qc.html">Station QC Helper</a>
        </div>
      </div>
    </div>
  </main>

  <script>
    const periodSelector = document.getElementById('periodSelector');
    const areaSelector = document.getElementById('areaSelector');
    const mapImage = document.getElementById('precipMap');
    const downloadPngLink = document.getElementById('downloadPngLink');

    function getMapFilename(period, area) {
      if (area === 'full') {
        return `lix_${period}_precip_latest.png`;
      }

      return `lix_${period}_precip_${area}_latest.png`;
    }

    function setMapImage() {
      const period = periodSelector.value;
      const area = areaSelector.value;
      const filename = getMapFilename(period, area);
      const periodLabel = periodSelector.options[periodSelector.selectedIndex].text;
      const areaLabel = areaSelector.options[areaSelector.selectedIndex].text;

      downloadPngLink.href = filename;
      downloadPngLink.download = filename;
      mapImage.alt = `${areaLabel} ${periodLabel} precipitation map`;
      mapImage.src = filename + '?t=' + Date.now();
    }

    periodSelector.addEventListener('change', setMapImage);
    areaSelector.addEventListener('change', setMapImage);

    setMapImage();
  </script>
</body>
</html>
